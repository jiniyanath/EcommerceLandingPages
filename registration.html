<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Page</title>


    <meta name="description"
      content="Premium cotton T-shirts for everyday fashion. Shop latest collections from The Fabrix.">


<!-- =========================================================
     BOOTSTRAP
========================================================= -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet">


<!-- =========================================================
     BOOTSTRAP ICONS
========================================================= -->

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">


<!-- =========================================================
     GOOGLE FONTS
========================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap"
      rel="stylesheet">


    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <!-- custom CSS -->
    <link rel="stylesheet" type="text/css" href="style11.css">
    
</head>

<body>
    

<div class="row g-0">
                    <!-- Left Column (Dark Branding Banner matching image) -->
                    <div class="col-lg-5 d-none d-lg-block">
                        <div class="modal-left-banner">
                            <!-- Top Brand Logo -->
                            <div class="brand-logo-wrap">
                                <div class="brand-icon-box">TF</div>
                                <div>
                                    <div class="fw-bold text-white lh-1" style="font-size: 1.1rem; letter-spacing: 0.5px;">THE FABRIXS</div>
                                    <div class="text-muted extra-small" style="font-size: 0.65rem;">Premium Cotton Tees</div>
                                </div>
                            </div>

                            <!-- Middle Main Heading -->
                            <div class="my-auto py-5">
                                <h2 class="mb-3">Join Our<br><span style="color: var(--primary-yellow);">Community</span></h2>
                                <p class="text-light opacity-75 small mb-0" style="max-width: 280px; line-height: 1.6;">
                                    Get exclusive offers, latest collections and be the first to know about new arrivals.
                                </p>
                            </div>

                            <!-- Bottom Highlights -->
                            <div class="row text-center g-2 pt-3 border-top border-secondary border-opacity-50">
                                <div class="col-4">
                                    <div class="modal-feature-icon"><i class="fa-solid fa-truck-fast"></i></div>
                                    <div class="fw-semibold extra-small text-white" style="font-size: 0.7rem;">Fast Delivery</div>
                                </div>
                                <div class="col-4">
                                    <div class="modal-feature-icon"><i class="fa-solid fa-shield-halved"></i></div>
                                    <div class="fw-semibold extra-small text-white" style="font-size: 0.7rem;">Secure Shopping</div>
                                </div>
                                <div class="col-4">
                                    <div class="modal-feature-icon"><i class="fa-solid fa-star"></i></div>
                                    <div class="fw-semibold extra-small text-white" style="font-size: 0.7rem;">Exclusive Offers</div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column (Form Area) -->
                    <div class="col-lg-7">
                        <div class="modal-right-form">
                            <h3 class="fw-bold text-dark mb-1" id="accountModalLabel">Create Your Account</h3>
                            <p class="text-muted small mb-4">Fill in the details below to get started.</p>

                            <form id="accountRegisterForm" onsubmit="handleRegisterSubmit(event)">
                                <!-- Full Name & Email Row -->
                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <div class="custom-modal-input-group">
                                            <i class="fa-regular fa-user input-icon-left"></i>
                                            <input type="text" class="form-control" placeholder="Full Name *" required>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="custom-modal-input-group">
                                            <i class="fa-regular fa-envelope input-icon-left"></i>
                                            <input type="email" class="form-control" placeholder="Email Address *" required>
                                        </div>
                                    </div>
                                </div>

                                <!-- Mobile Number -->
                                <div class="mb-3">
                                    <div class="custom-modal-input-group">
                                        <i class="fa-solid fa-phone input-icon-left"></i>
                                        <input type="tel" class="form-control" placeholder="Mobile Number *" required>
                                    </div>
                                </div>

                                <!-- Password -->
                                <div class="mb-3">
                                    <div class="custom-modal-input-group">
                                        <i class="fa-solid fa-lock input-icon-left"></i>
                                        <input type="password" id="regPassword" class="form-control" placeholder="Password *" required>
                                        <i class="fa-regular fa-eye input-icon-right" onclick="togglePasswordVisibility('regPassword', this)"></i>
                                    </div>
                                </div>

                                <!-- Confirm Password -->
                                <div class="mb-3">
                                    <div class="custom-modal-input-group">
                                        <i class="fa-solid fa-lock input-icon-left"></i>
                                        <input type="password" id="regConfirmPassword" class="form-control" placeholder="Confirm Password *" required>
                                        <i class="fa-regular fa-eye input-icon-right" onclick="togglePasswordVisibility('regConfirmPassword', this)"></i>
                                    </div>
                                </div>

                                <!-- Terms & Conditions Checkbox -->
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="termsCheck" checked required>
                                    <label class="form-check-label small text-muted" for="termsCheck">
                                        I agree to the <a href="#" class="text-primary text-decoration-none fw-semibold">Terms & Conditions</a> and <a href="#" class="text-primary text-decoration-none fw-semibold">Privacy Policy</a>
                                    </label>
                                </div>

                                <!-- Proceed Button -->
                                <!-- <button type="submit" class="btn btn-register-submit w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
                                    <a href=""> CONFIRM ORDER <i class="fa-solid fa-arrow-right"></i>
                                </button> -->

                                 <!-- go to Confirm Order page Button -->
                                <button type="button" class="btn btn-register-submit w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
                                    <a href="confirm_order.html"> REGISTRER <i class="fa-solid fa-arrow-right"></i>
                                </button>


                                <!-- OR Divider -->
                                <div class="divider-or">OR</div>

                                <!-- Google Signup Button -->
                                <button type="button" class="btn btn-google-signup w-100 mb-4" onclick="showToast('Connecting to Google Account...')">
                                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
                                    Continue with Google
                                </button>

                                <!-- Login Link Bottom -->
                                <div class="text-center extra-small text-muted" style="font-size: 0.85rem;">
                                    Already have an account? <a href="#" class="text-primary fw-bold text-decoration-none" onclick="showToast('Opening Login Window...')">Login</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>



</body>
</html>
